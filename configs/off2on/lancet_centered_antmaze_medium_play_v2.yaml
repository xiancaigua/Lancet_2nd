# Centered Residual component-ablation online branch. Load the seed-matched shared WSRL
# offline_final.pt on the CLI; do not run independent Lancet pretraining.
env_backend: d4rl_legacy
dataset_backend: d4rl_legacy
env_id: antmaze-medium-play-v2
offline_dataset: antmaze-medium-play-v2
obs_mode: state
num_envs: 1
num_eval_envs: 1
num_offline_steps: 0
num_online_steps: 500000
utd: 4.0
batch_size: 1024
buffer_size: 1000000
learning_starts: 0
training_freq: 64
reward_scale: 10.0
reward_bias: -5.0
sparse_reward_mc: true
sparse_negative_reward: -5.0
hidden_dim: 256
actor_hidden_layers: 2
critic_hidden_layers: 4
std_parameterization: uniform
kernel_init: orthogonal_near_zero_output
n_critics: 10
critic_subsample_size: 2
actor_use_layer_norm: true
critic_use_layer_norm: true
backup_entropy: false
target_entropy: 0.0
use_cql_loss: true
cql_alpha: 5.0
cql_autotune_alpha: true
cql_target_action_gap: 0.8
online_replay_mode: empty
offline_data_ratio: 0.0
online_cql_alpha: 0.0
online_use_cql_loss: false
warmup_steps: 5000
policy_lr: 0.0001
q_lr: 0.0003
alpha_lr: 0.0001
cql_alpha_lr: 0.0003
policy_frequency: 1
target_network_frequency: 1
offline_eval_freq: null
online_eval_freq: 2000
eval_freq: 0
num_eval_steps: 20000
num_eval_episodes: 20
checkpoint_freq: 25000
capture_video: false
log_type: wandb
seed: 0
lancet_variant: centered
residual_hidden_dim: 128
residual_hidden_layers: 2
residual_lr: 0.001
residual_fit_coef: 1.0
residual_small_coef: 0.0001
local_action_count: 8
local_action_noise_scale: 0.1
uncertainty_beta: 1.0
uncertainty_ema_decay: 0.99
uncertainty_weight_max: 3.0
uncertainty_eps: 1.0e-8
handoff_window_steps: 50000
