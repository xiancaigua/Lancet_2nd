# Seed-0 stability-gate shared WSRL initializer (not a paper result).
env_backend: d4rl_legacy
dataset_backend: d4rl_legacy
env_id: antmaze-medium-play-v2
offline_dataset: antmaze-medium-play-v2
obs_mode: state
num_envs: 1
num_eval_envs: 1
num_offline_steps: 20000
num_online_steps: 0
utd: 4.0
batch_size: 1024
buffer_size: 1000000
learning_starts: 0
training_freq: 64
gamma: 0.99
tau: 0.005
reward_scale: 10.0
reward_bias: -5.0
sparse_reward_mc: true
sparse_negative_reward: -5.0
hidden_dim: 256
actor_hidden_layers: 2
critic_hidden_layers: 4
std_parameterization: uniform
kernel_init: orthogonal_near_zero_output
n_critics: 10
critic_subsample_size: 2
actor_use_layer_norm: true
critic_use_layer_norm: true
backup_entropy: false
target_entropy: 0.0
use_cql_loss: true
use_calql: true
cql_alpha: 5.0
cql_autotune_alpha: true
cql_target_action_gap: 0.8
policy_lr: 0.0001
q_lr: 0.0003
alpha_lr: 0.0001
cql_alpha_lr: 0.0003
policy_frequency: 1
target_network_frequency: 1
warmup_steps: 0
offline_eval_freq: 2000
online_eval_freq: null
eval_freq: 0
num_eval_steps: 20000
num_eval_episodes: 20
checkpoint_freq: 5000
save_final_checkpoint: true
save_replay_buffer: false
capture_video: false
log_type: tensorboard
log_freq: 1000
seed: 0
