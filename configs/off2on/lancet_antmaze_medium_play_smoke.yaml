# Online-only current Lancet tiny smoke. Supply the shared WSRL
# offline_final.pt with --load_checkpoint.
env_backend: d4rl_legacy
dataset_backend: d4rl_legacy
env_id: antmaze-medium-play-v2
offline_dataset: antmaze-medium-play-v2
obs_mode: state
num_envs: 1
num_eval_envs: 0
num_offline_steps: 0
num_online_steps: 8
utd: 1.0
batch_size: 4
buffer_size: 1024
learning_starts: 0
training_freq: 1
warmup_steps: 2
n_critics: 2
critic_subsample_size: 2
hidden_dim: 32
actor_hidden_layers: 1
critic_hidden_layers: 1
use_cql_loss: false
use_calql: false
backup_entropy: false
online_use_cql_loss: false
online_replay_mode: empty
offline_eval_freq: null
online_eval_freq: null
eval_freq: 0
log_type: none
capture_video: false
seed: 0
save_final_checkpoint: true
lancet_variant: lancet
residual_hidden_dim: 32
residual_hidden_layers: 1
residual_lr: 0.001
residual_fit_coef: 1.0
residual_small_coef: 0.0001
local_action_count: 8
local_action_noise_scale: 0.1
uncertainty_beta: 1.0
uncertainty_ema_decay: 0.99
uncertainty_weight_max: 3.0
uncertainty_eps: 1.0e-8
handoff_window_steps: 50000
