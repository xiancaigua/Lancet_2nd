# Fast WSRL integration smoke. It intentionally does not represent a benchmark.
env_backend: d4rl_legacy
dataset_backend: d4rl_legacy
env_id: antmaze-medium-play-v2
offline_dataset: antmaze-medium-play-v2
obs_mode: state
num_envs: 1
num_eval_envs: 1
num_offline_steps: 2
num_online_steps: 4
utd: 1.0
batch_size: 4
buffer_size: 1024
learning_starts: 1
training_freq: 1
warmup_steps: 0
n_critics: 2
critic_subsample_size: 2
hidden_dim: 32
actor_hidden_layers: 1
critic_hidden_layers: 1
use_cql_loss: false
use_calql: false
backup_entropy: false
online_use_cql_loss: false
online_replay_mode: empty
offline_eval_freq: null
online_eval_freq: null
eval_freq: 0
log_type: none
log_dir: /data/lancet/runs
checkpoint_dir: /data/lancet/checkpoints/wsrl_smoke
checkpoint_freq: 1
save_final_checkpoint: true
capture_video: false
seed: 0
